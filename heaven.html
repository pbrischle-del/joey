<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olli & Joey – Heavenly Ascension</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #ffffff;
            background-color: #f5ebe0;
            position: relative;
            overflow-x: hidden;
        }

        /* ÜBERSCHRIFT OBEN MITTIG ÜBER BEIDEN SEITEN */
        .page-header {
            position: absolute;
            top: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .heaven-title {
            font-family: 'Great Vibes', cursive;
            font-size: 3.6rem;
            font-weight: normal;
            margin: 0;
            letter-spacing: 2px;
            color: #fffdf7;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.95),
                         0 0 22px rgba(216, 112, 147, 0.85),
                         0 2px 6px rgba(43, 30, 22, 0.55);
        }

        /* ZURÜCK-BUTTON UNTEN MITTIG */
        .return-btn-wrapper {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }

        .heaven-return-btn {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            background-color: rgba(26, 0, 13, 0.78);
            color: #fffdf7;
            border: 1px solid rgba(255, 253, 247, 0.7);
            padding: 9px 18px 7px 18px;
            border-radius: 22px;
            font-family: 'Georgia', serif;
            font-size: 0.85rem;
            font-style: italic;
            letter-spacing: 0.5px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.35), 0 4px 12px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .heaven-return-btn .arrow {
            font-size: 1.1rem;
            font-style: normal;
            line-height: 1;
            transition: transform 0.3s ease;
        }

        .heaven-return-btn:hover {
            background-color: #fffdf7;
            color: #1a000d;
            box-shadow: 0 0 22px rgba(255, 255, 255, 0.85);
            transform: translateY(3px);
        }

        .heaven-return-btn:hover .arrow {
            transform: translateY(3px);
        }

        /* Flexbox-Container für Standardansicht (Desktop / Tablet) */
        .split-container {
            display: flex;
            flex-direction: row;
            min-height: 100vh;
            width: 100%;
        }

        /* Linke Seite: Rosa */
        .joey-side {
            background-color: #d87093;
            color: #1a000d;
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 110px 15px 95px 15px;
            box-sizing: border-box;
        }

        /* Rechte Seite: Beige */
        .olli-side {
            background-color: #f5ebe0;
            color: #2b1e16;
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 110px 15px 95px 15px;
            box-sizing: border-box;
            border-left: 1px solid rgba(216, 112, 147, 0.4);
        }

        /* ANPASSUNG FÜR HANDYS (MOBILE ANSICHT) */
        @media (max-width: 768px) {
            .heaven-title {
                font-size: 2.7rem;
            }
            .split-container {
                flex-direction: column;
            }
            .joey-side {
                width: 100%;
                min-height: 50vh;
                padding: 100px 20px 40px 20px;
            }
            .olli-side {
                width: 100%;
                min-height: 50vh;
                padding: 40px 20px 95px 20px;
                border-left: none;
                border-top: 1px solid rgba(216, 112, 147, 0.4);
            }
            .heaven-return-btn {
                font-size: 0.8rem;
                padding: 8px 15px 6px 15px;
            }
        }
    </style>
</head>
<body>

    <header class="page-header">
        <h1 class="heaven-title">✦ Heavenly Ascension ✦</h1>
    </header>

    <div class="split-container">
        <!-- LINKE SEITE (ROSA) -->
        <div class="joey-side">
            <!-- Platz für Inhalte -->
        </div>

        <!-- RECHTE SEITE (BEIGE) -->
        <div class="olli-side">
            <!-- Platz für Inhalte -->
        </div>
    </div>

    <div class="return-btn-wrapper">
        <a href="index.html" class="heaven-return-btn">
            <span>Let me fall again...</span>
            <span class="arrow">↓</span>
        </a>
    </div>

</body>
</html>
